# Default values for cors-proxy.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 2

image:
  repository: ghcr.io/cloudoperators/greenhouse
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  # tag:
  # Overrides the image tag to use a specific digest instead
  # digest: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

# Deployment platform. Selects cert handling (tls-acme vs gardener cert-service).
#   generic | gardener
platform: generic

ingress:
  enabled: true
  className: "nginx"
  annotations: {}
  tls: true

# Gateway API settings. When gateway.enabled=true and Gateway API CRDs are present,
# a ListenerSet, HTTPRoute, Backend, BackendTLSPolicy and CORS TrafficPolicy are rendered
# instead of an Ingress+Deployment.
gateway:
  enabled: false
  # External hostname of the API server used as the static Backend target.
  # For in-cluster use: kubernetes.default.svc.cluster.local
  apiserverHostname: ""
  # Name/namespace of the central Gateway deployed by the manager chart.
  parentRefName: ""
  parentRefNamespace: ""
  # Annotations placed on the ListenerSet resource (e.g. cert-manager issuer).
  listenerSetAnnotations: {}
  # Annotations placed on the HTTPRoute resource (e.g. external-dns).
  httpRouteAnnotations: {}
  # TLS certificate Secret name for the HTTPS listener.
  tls:
    secretName: ""  # defaults to <fullname>-tls; cert-manager will create the Secret at this name

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

tolerations: []
