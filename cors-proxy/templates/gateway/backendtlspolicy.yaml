{{- if and .Values.gateway.enabled (.Capabilities.APIVersions.Has "gateway.networking.k8s.io/v1") -}}
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: {{ .Release.Name }}-apiserver
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cors-proxy.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.kgateway.dev
      kind: Backend
      name: {{ .Release.Name }}-apiserver
  validation:
    hostname: {{ required "apiserverHostname is required" .Values.apiserverHostname }}
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: kube-root-ca.crt
{{- end }}
