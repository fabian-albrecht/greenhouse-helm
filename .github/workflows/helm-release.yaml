name: Package and Publish Helm Charts

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths-ignore:
      - '**/plugindefinition.yaml'

permissions:
  contents: write
  packages: write

env:
  REGISTRY_LOGIN: ghcr.io

jobs:
  detect-changes:
    name: Detect changed charts
    runs-on: [ ubuntu-latest ]
    permissions:
      contents: read
    outputs:
      include: ${{ steps.set.outputs.include }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate paths-filter config
        if: github.event_name != 'workflow_dispatch'
        run: |
          jq -c '.[]' .github/charts.json | while read -r chart; do
            name=$(echo "$chart" | jq -r '.name')
            has_paths=$(echo "$chart" | jq 'has("paths")')
            echo "${name}:"
            if [ "$has_paths" = "true" ]; then
              echo "$chart" | jq -r '.paths[] | "  - '\''" + . + "'\''"'
            else
              echo "$chart" | jq -r '"  - '\''" + .chartDir + "/**'\''"'
            fi
          done > charts-filter.yml
          cat charts-filter.yml

      - name: Filter changed charts
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: charts-filter.yml

      - name: Build matrix
        id: set
        env:
          EVENT_NAME: ${{ github.event_name }}
          FILTER_CHANGES: ${{ steps.filter.outputs.changes }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            changed=$(jq -c '[.[].name]' .github/charts.json)
          else
            changed="$FILTER_CHANGES"
          fi

          include=$(jq -c --argjson changed "$changed" '
            map(select(.name as $n | $changed | index($n) != null))
            | map({chartName: .name, chartDir: .chartDir})
          ' .github/charts.json)

          echo "include=$include" >> "$GITHUB_OUTPUT"
          echo "Will release: $changed"

  helm-release:
    name: Release (${{ matrix.chartName }})
    needs: detect-changes
    if: needs.detect-changes.outputs.include != '[]' && needs.detect-changes.outputs.include != ''
    runs-on: [ ubuntu-latest ]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect-changes.outputs.include) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: "v3.19.5"

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY_LOGIN }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set OCI base path
        run: echo "OCI_BASE=ghcr.io/${GITHUB_REPOSITORY,,}/charts" >> "$GITHUB_ENV"

      - name: Check if Helm chart with same version already exists
        id: check-chart
        run: |
          chartVersion=$(yq .version "${{ matrix.chartDir }}/Chart.yaml")
          echo "chart_version=${chartVersion}" >> "$GITHUB_OUTPUT"
          if helm pull "oci://${{ env.OCI_BASE }}/${{ matrix.chartName }}" --version "$chartVersion"; then
            echo "bump=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Chart needs version bump
        if: steps.check-chart.outputs.bump == 'true'
        env:
          CHART_VERSION: ${{ steps.check-chart.outputs.chart_version }}
        run: |
          echo "Chart ${{ matrix.chartName }}:${{ env.CHART_VERSION }} already exists in the registry. Skipping upload. Please increment the chart version."
          exit 1

      - name: Package and push chart
        if: steps.check-chart.outputs.bump != 'true'
        run: |
          helm dependency update ${{ matrix.chartDir }}
          helm package ${{ matrix.chartDir }} -d ${{ matrix.chartDir }}
          PKG_NAME=$(ls ${{ matrix.chartDir }}/*.tgz)
          helm push "${PKG_NAME}" "oci://${{ env.OCI_BASE }}"
