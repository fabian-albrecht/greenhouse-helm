apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: {{ .Release.Name }}-discovery
  namespace: {{ .Release.Namespace }}
  {{- with .Values.listenerSetAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ required "gateway.parentRefName is required" .Values.gateway.parentRefName }}
    {{- with .Values.gateway.parentRefNamespace }}
    namespace: {{ . }}
    {{- end }}
  listeners:
    - name: https-discovery
      protocol: HTTPS
      port: 443
      hostname: {{ include "gateway-discovery-server.hostname" . | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ required "tls.secretName is required" .Values.tls.secretName }}
