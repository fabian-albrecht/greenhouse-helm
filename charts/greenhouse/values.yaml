# Override the name used in resource labels/names. Defaults to the chart name.
nameOverride: greenhouse
# Override the full name used in resource names. Defaults to "<release>-<nameOverride>".
# fullnameOverride: ""

# Global values are shared across all charts in an umbrella deployment.
global:
  # DNS domain for this Greenhouse installation (e.g. "greenhouse.example.com").
  # Used as the base domain for all ingress hostnames and OIDC issuer URLs.
  # Required — no default.
  dnsDomain: ""

  dex:
    # Dex storage backend. Use "kubernetes" (CRD-based, no external DB) or
    # "postgres" (requires a PostgreSQL instance configured below).
    backend: kubernetes
    # PostgreSQL connection details — only used when backend is "postgres".
    postgresql:
      postgresqlDatabase: dex
      postgresqlUsername: dex

  plugin:
    # Mirror plugin OCI artifacts to a local registry before deploying to remote
    # clusters. Requires a local OCI-compatible registry reachable by the manager.
    ociMirroringEnabled: false

  pluginPreset:
    # Evaluate CEL expressions in PluginPreset option value templates.
    expressionEvaluationEnabled: true
    # Enable PluginPreset integration: automatically create Plugins for each
    # cluster that matches a PluginPreset's cluster selector.
    integrationEnabled: true

  workloadIdentity:
    # Enable workload identity support (e.g. IRSA / Workload Identity Federation)
    # so plugins can assume cloud-provider roles without static credentials.
    enabled: false

# Top-level service account used by helm hooks and similar non-controller workloads.
# Controller and webhook service accounts are managed under their own sections below.
serviceAccount:
  # Create the service account. Set to false to bring your own.
  create: true
  # Name of the service account. Defaults to the full release name when create is true.
  name: ""

alerts:
  # Deploy PrometheusRule manifests for Greenhouse control-plane alerting.
  enabled: true

perses:
  # Deploy Perses dashboard ConfigMaps for the Greenhouse control-plane.
  # Requires the Perses operator to be installed in the cluster.
  enabled: true

controllerManager:
  image:
    repository: ghcr.io/cloudoperators/greenhouse
    # Overrides the image tag. Defaults to the chart appVersion.
    # tag: ""
    # Use a specific image digest instead of a tag (takes precedence over tag).
    # digest: ""

  replicas: 3

  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    # limits: {}

  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  serviceAccount:
    # Annotations on the controller manager service account (e.g. for IRSA).
    annotations: {}

  # Persistent volume claim for Flux artifact storage (HelmRelease chart caching).
  artifactStorage:
    path: /tmp/data
    sizeLimit: 1Gi

  # Per-controller concurrency tuning. Increase for large fleets at the cost of
  # higher API server load.
  config:
    plugin:
      maxConcurrentReconciles: 10
    pluginPreset:
      maxConcurrentReconciles: 10
    cluster:
      maxConcurrentReconciles: 5
    catalog:
      maxConcurrentReconciles: 5
    team:
      maxConcurrentReconciles: 5
    teamRoleBinding:
      maxConcurrentReconciles: 5
    bootstrap:
      maxConcurrentReconciles: 5
    kubeconfig:
      maxConcurrentReconciles: 1
    pluginDefinition:
      maxConcurrentReconciles: 10
    clusterPluginDefinition:
      maxConcurrentReconciles: 5

  # Extra CLI arguments passed to the manager binary.
  args: []

  # Extra environment variables injected into the manager container.
  env: []

webhook:
  replicas: 2

  # Webhook serving-cert source. When certManager.enabled is true, a cert-manager
  # Issuer+Certificate provision the cert and the controller's cert-rotator is
  # disabled. When false (default), the controller self-seeds the cert into the
  # greenhouse-webhook-cert Secret via its built-in rotator (no cert-manager).
  certManager:
    enabled: false
  # Bring your own serving-cert Secret instead of self-seeding or cert-manager.
  secret:
    useExisting: false

  service:
    type: ClusterIP
    ports:
      - port: 443
        protocol: TCP
        targetPort: 9443

# PostgreSQL sub-chart (postgresql-ng)
# Set together with global.dex.backend: postgres.
postgresqlng:
  enabled: false
  global:
    # Container image registry for the postgresql-ng image. Required by the sub-chart.
    registry: ""
  alerts:
    enabled: false
    support_group: greenhouse
  resources: {}
  databases:
    dex: {}
  users:
    dex: {}

# Legacy pod-based CORS proxy that fronts the Kubernetes API for the dashboard
# UI in the pre-Gateway (nginx ingress) topology. Disabled by default; enable
# per-environment during the Gateway migration. Uses the same image/appVersion
# as the controller (controllerManager.image), so one bump covers both.
cors:
  enabled: false
  replicaCount: 2
  imagePullSecrets: []
  serviceAccount:
    create: false
    annotations: {}
    name: ""
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  # Overrides the upstream target; defaults to the in-cluster API server.
  apiServerFQDN: ""
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: true
    className: "nginx"
    annotations: {}
    tls: true
  resources: {}
  nodeSelector: {}
  tolerations: []

# Organization custom resources (greenhouse.sap/Organization). Keyed by name;
# each entry renders an Organization with its spec fields passed through verbatim.
# All spec fields are optional — omit any you don't need.
#
# Example with OIDC:
#   organizations:
#     my-org:
#       displayName: "My Organisation"
#       mappedOrgAdminIdPGroup: my-org-admins
#       authentication:
#         oidc:
#           issuer: https://idp.example.com
#           clientIDReference:
#             name: my-org-oidc
#             key: clientID
#           clientSecretReference:
#             name: my-org-oidc
#             key: clientSecret
organizations:
  greenhouse:
    description: Greenhouse System Organization

# Default Catalog custom resources (greenhouse.sap/Catalog). Keyed by name;
# each entry renders a Catalog with its spec.sources passed through verbatim.
catalogs:
  greenhouse-helm:
    sources:
      - repository: https://github.com/cloudoperators/greenhouse-helm.git
        resources:
          - charts/*/plugindefinition.yaml
        interval: 10m
