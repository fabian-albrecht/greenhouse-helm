{{- with .Values.organizations }}
{{- range $name, $org := . }}
---
apiVersion: greenhouse.sap/v1alpha1
kind: Organization
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    "helm.sh/resource-policy": keep
    {{- with $org.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $org.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- with omit $org "annotations" "labels" }}
spec:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}
