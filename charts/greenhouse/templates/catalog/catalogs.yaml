{{- with .Values.catalogs }}
{{- range $name, $catalog := . }}
---
apiVersion: greenhouse.sap/v1alpha1
kind: Catalog
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    {{- with $catalog.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $catalog.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  sources:
  {{- toYaml $catalog.sources | nindent 2 }}
{{- end }}
{{- end }}