{{- if .Values.discovery.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: {{ .Release.Name }}-discovery
  namespace: {{ .Release.Namespace }}
  {{- with .Values.discovery.listenerSetAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ .Values.discovery.parentRefName | default (include "gateway.fullname" .) }}
    {{- with .Values.discovery.parentRefNamespace }}
    namespace: {{ . }}
    {{- end }}
  listeners:
    - name: https-discovery
      protocol: HTTPS
      port: 443
      hostname: {{ include "gateway.hostname" . | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ .Values.discovery.tls.secretName | default (printf "%s-tls" (include "gateway.fullname" .)) }}
{{- end }}
