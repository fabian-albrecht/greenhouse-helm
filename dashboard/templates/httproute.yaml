{{- if eq .Values.exposure.mode "gateway" -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "dashboard.fullname" . }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - name: {{ required "gateway.parentRefName is required when exposure.mode=gateway" .Values.gateway.parentRefName }}
      {{- with .Values.gateway.parentRefNamespace }}
      namespace: {{ . }}
      {{- end }}
      {{- with .Values.gateway.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  hostnames:
    - "{{ include "dashboard.hostname" $ }}"
    - "*.{{ include "dashboard.hostname" $ }}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "dashboard.fullname" . }}
          port: 80
{{- end }}
