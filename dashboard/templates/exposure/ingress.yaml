{{/*
Dashboard exposure — Ingress mode (default, opt-in via ingress.enabled).
A future gateway implementation (HTTPRoute/ListenerSet attaching to the central
Greenhouse Gateway) will live alongside this file under exposure/gateway/,
mirroring templates/cors-proxy/gateway/ and gated by a dashboard gateway toggle.
*/}}
{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "dashboard.fullname" . }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ required ".Values.ingress.className missing" .Values.ingress.className }}
  rules:
    - host: "{{ include "dashboard.hostname" $ }}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "dashboard.fullname" . }}
                port:
                  number: 80
    - host: "*.{{ include "dashboard.hostname" $ }}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "dashboard.fullname" . }}
                port:
                  number: 80

  tls:
    - hosts:
        - "{{ include "dashboard.hostname" $ }}"
        - "*.{{ include "dashboard.hostname" $ }}"
      secretName: "tls-{{ include "dashboard.fullname" . }}"
{{- end }}
