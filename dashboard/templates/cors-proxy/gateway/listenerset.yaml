{{- if and .Values.corsProxy.enabled .Values.corsProxy.gateway.enabled (.Capabilities.APIVersions.Has "gateway.networking.k8s.io/v1") -}}
{{- $fullName := include "cors-proxy.fullname" . -}}
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: {{ $fullName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cors-proxy.labels" . | nindent 4 }}
  {{- with .Values.corsProxy.gateway.listenerSetAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ required "corsProxy.gateway.parentRefName is required when corsProxy.gateway.enabled=true" .Values.corsProxy.gateway.parentRefName }}
    {{- with .Values.corsProxy.gateway.parentRefNamespace }}
    namespace: {{ . }}
    {{- end }}
  listeners:
    - name: https-cors-proxy
      protocol: HTTPS
      port: 443
      hostname: {{ include "cors-proxy.api.hostname" . | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ .Values.corsProxy.gateway.tls.secretName | default (printf "%s-tls" (include "cors-proxy.fullname" .)) }}
{{- end }}
