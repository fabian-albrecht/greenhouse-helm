{{- if and .Values.corsProxy.enabled .Values.corsProxy.gateway.enabled (.Capabilities.APIVersions.Has "gateway.networking.k8s.io/v1") -}}
apiVersion: gateway.kgateway.dev/v1alpha1
kind: Backend
metadata:
  name: {{ .Release.Name }}-apiserver
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cors-proxy.labels" . | nindent 4 }}
spec:
  type: Static
  static:
    hosts:
      - host: {{ required "corsProxy.gateway.apiserverHostname is required" .Values.corsProxy.gateway.apiserverHostname }}
        port: 443
{{- end }}
