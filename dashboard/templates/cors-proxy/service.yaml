{{- if and .Values.corsProxy.enabled (not .Values.corsProxy.gateway.enabled) -}}

apiVersion: v1
kind: Service
metadata:
  name: {{ include "cors-proxy.fullname" . }}
  labels:
    {{- include "cors-proxy.labels" . | nindent 4 }}
spec:
  type: {{ .Values.corsProxy.service.type }}
  ports:
    - port: {{ .Values.corsProxy.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: 6543
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "cors-proxy.selectorLabels" . | nindent 4 }}

{{- end -}}
