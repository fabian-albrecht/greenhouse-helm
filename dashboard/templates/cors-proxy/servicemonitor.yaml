{{- if and .Values.corsProxy.enabled (not .Values.corsProxy.gateway.enabled) -}}
{{- if .Capabilities.APIVersions.Has "monitoring.coreos.com/v1/ServiceMonitor" }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "cors-proxy.fullname" . }}
  labels:
    plugin: kube-monitoring
spec:
  endpoints:
    - honorLabels: true
      interval: 30s
      port: metrics
      scheme: http
      path: /metrics
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      {{- include "cors-proxy.selectorLabels" . | nindent 6 }}
{{- end -}}

{{- end -}}
