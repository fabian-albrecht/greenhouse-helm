{{- if and .Values.corsProxy.enabled (not .Values.corsProxy.gateway.enabled) -}}

apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cors-proxy.serviceAccountName" . }}
  labels:
    {{- include "cors-proxy.labels" . | nindent 4 }}
  {{- with .Values.corsProxy.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
